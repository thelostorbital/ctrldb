name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QLTY_TELEMETRY: "off"

jobs:
  quality:
    name: Test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Qlty
        uses: qltysh/qlty-action/install@782ebe01413b63470fe8c3d481de77cef79e1486 # v2.1.0

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Enforce type-aware architecture boundaries
        run: go run ./internal/archcheck

      - name: Run tests
        run: |
          go test ./...
          go test -race ./...

      - name: Run quality and security checks
        run: qlty check --all --no-fix --level=low --fail-level=low

      - name: Prove architecture rules reject violations
        run: bash scripts/test-architecture-rules.sh

      - name: Report changed-code maintainability signals
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          QLTY_UPSTREAM: origin/${{ github.base_ref }}
        run: qlty smells --upstream "$QLTY_UPSTREAM" --no-snippets
