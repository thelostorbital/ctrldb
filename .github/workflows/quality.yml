name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  QLTY_TELEMETRY: "off"

jobs:
  quality:
    name: Test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

      - name: Install pinned supply-chain tools
        env:
          TOOL_BIN: ${{ runner.temp }}/ctrldb-tools
        run: |
          mkdir -p "$TOOL_BIN"
          GOBIN="$TOOL_BIN" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOBIN="$TOOL_BIN" go install github.com/google/go-licenses/v2@v2.0.1
          echo "$TOOL_BIN" >> "$GITHUB_PATH"

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Enforce type-aware architecture boundaries
        run: go run ./internal/archcheck

      - name: Run tests
        run: |
          go test ./...
          go test -race ./...

      - name: Run quality and security checks
        run: qlty check --all --no-fix --level=low --fail-level=low

      - name: Scan for reachable Go vulnerabilities
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 govulncheck ./...
          done

      - name: Enforce Go dependency license policy
        run: bash scripts/check-go-licenses.sh

      - name: Prove architecture rules reject violations
        run: bash scripts/test-architecture-rules.sh

      - name: Report changed-code maintainability signals
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          QLTY_UPSTREAM: origin/${{ github.base_ref }}
        run: qlty smells --upstream "$QLTY_UPSTREAM" --no-snippets
