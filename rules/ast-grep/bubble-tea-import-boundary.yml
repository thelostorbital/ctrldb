id: bubble-tea-import-boundary
language: Go
severity: warning
message: Bubble Tea is restricted to internal/tui.
files:
  - cmd/**/*.go
  - internal/**/*.go
ignores:
  - internal/tui/**/*.go
rule:
  all:
    - kind: interpreted_string_literal
    - regex: ^"charm\.land/bubbletea/v2"$
    - inside:
        kind: import_spec
