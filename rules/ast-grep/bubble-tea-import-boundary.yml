id: bubble-tea-import-boundary
language: Go
severity: warning
message: Bubble Tea is restricted to internal/tui.
files:
  - "**/*.go"
ignores:
  - internal/tui/**/*.go
rule:
  any:
    - all:
        - kind: interpreted_string_literal
        - regex: ^"(charm\.land/bubbletea/v2|github\.com/charmbracelet/bubbletea(/v[0-9]+)?)"$
        - inside:
            kind: import_spec
    - all:
        - kind: raw_string_literal
        - regex: ^`(charm\.land/bubbletea/v2|github\.com/charmbracelet/bubbletea(/v[0-9]+)?)`$
        - inside:
            kind: import_spec
