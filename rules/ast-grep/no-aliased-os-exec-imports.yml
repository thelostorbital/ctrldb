id: no-aliased-os-exec-imports
language: Go
severity: warning
message: Import os/exec without an alias so process-boundary rules remain unambiguous.
files:
  - "**/*.go"
rule:
  any:
    - pattern:
        context: import $ALIAS "os/exec"
        selector: import_spec
    - pattern:
        context: import $ALIAS `os/exec`
        selector: import_spec
