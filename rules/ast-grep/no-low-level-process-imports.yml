id: no-low-level-process-imports
language: Go
severity: warning
message: Low-level process packages are forbidden; use the validated runner adapter.
files:
  - "**/*.go"
rule:
  any:
    - all:
        - kind: interpreted_string_literal
        - regex: ^"(syscall|golang\.org/x/sys/(execabs|unix|windows))"$
        - inside:
            kind: import_spec
    - all:
        - kind: raw_string_literal
        - regex: ^`(syscall|golang\.org/x/sys/(execabs|unix|windows))`$
        - inside:
            kind: import_spec
