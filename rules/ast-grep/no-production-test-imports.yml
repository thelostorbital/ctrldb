id: no-production-test-imports
language: Go
severity: warning
message: Production code must not import test-only or fake infrastructure.
files:
  - "**/*.go"
ignores:
  - "**/*_test.go"
  - "**/test/**/*.go"
  - "**/tests/**/*.go"
  - "**/testutil/**/*.go"
  - "**/testutils/**/*.go"
  - "**/fake/**/*.go"
  - "**/fakes/**/*.go"
rule:
  any:
    - all:
        - kind: interpreted_string_literal
        - regex: ^"([^"]*/)?(test|tests|testutil|testutils|fake|fakes)(/[^"]*)?"$
        - inside:
            kind: import_spec
    - all:
        - kind: raw_string_literal
        - regex: ^`([^`]*/)?(test|tests|testutil|testutils|fake|fakes)(/[^`]*)?`$
        - inside:
            kind: import_spec
