id: no-raw-process-apis
language: Go
severity: warning
message: Low-level process APIs are forbidden; use the validated runner adapter.
files:
  - "**/*.go"
rule:
  any:
    - pattern:
        context: func f() { os.StartProcess($$$ARGS) }
        selector: call_expression
    - all:
        - pattern:
            context: func f() { $PKG.StartProcess($$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG "os"
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: func f() { $PKG.StartProcess($$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG `os`
                selector: import_spec
              stopBy: end
    - pattern:
        context: func f() { syscall.StartProcess($$$ARGS) }
        selector: call_expression
    - pattern:
        context: func f() { syscall.Exec($$$ARGS) }
        selector: call_expression
    - pattern:
        context: func f() { syscall.ForkExec($$$ARGS) }
        selector: call_expression
    - pattern:
        context: func f() { unix.Exec($$$ARGS) }
        selector: call_expression
    - pattern:
        context: func f() { unix.ForkExec($$$ARGS) }
        selector: call_expression
    - pattern:
        context: func f() { windows.CreateProcess($$$ARGS) }
        selector: call_expression
