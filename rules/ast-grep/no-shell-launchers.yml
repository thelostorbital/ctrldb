id: no-shell-launchers
language: Go
severity: warning
message: Shell processes are forbidden; invoke programs with structured arguments.
files:
  - "**/*.go"
rule:
  any:
    - all:
        - pattern:
            context: func f() { exec.Command($SHELL, $$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import "os/exec"
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: func f() { $PKG.Command($SHELL, $$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG "os/exec"
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: func f() { $PKG.Command($SHELL, $$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG `os/exec`
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: func f() { exec.CommandContext($CTX, $SHELL, $$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import "os/exec"
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: func f() { $PKG.CommandContext($CTX, $SHELL, $$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG "os/exec"
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: func f() { $PKG.CommandContext($CTX, $SHELL, $$$ARGS) }
            selector: call_expression
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG `os/exec`
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: var _ = exec.Cmd{$$$FIELDS}
            selector: composite_literal
        - has:
            pattern:
              context: 'var _ = T{Path: $SHELL}'
              selector: keyed_element
            stopBy: end
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import "os/exec"
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: var _ = $PKG.Cmd{$$$FIELDS}
            selector: composite_literal
        - has:
            pattern:
              context: 'var _ = T{Path: $SHELL}'
              selector: keyed_element
            stopBy: end
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG "os/exec"
                selector: import_spec
              stopBy: end
    - all:
        - pattern:
            context: var _ = $PKG.Cmd{$$$FIELDS}
            selector: composite_literal
        - has:
            pattern:
              context: 'var _ = T{Path: $SHELL}'
              selector: keyed_element
            stopBy: end
        - inside:
            kind: source_file
            stopBy: end
            has:
              pattern:
                context: import $PKG `os/exec`
                selector: import_spec
              stopBy: end
constraints:
  SHELL:
    regex: '(?i)^["`]([^"`/\\]*[/\\])*(bash|cmd|cmd\.exe|csh|dash|env|fish|ksh|powershell|powershell\.exe|pwsh|sh|tcsh|zsh)["`]$'
