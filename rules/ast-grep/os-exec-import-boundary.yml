id: os-exec-import-boundary
language: Go
severity: warning
message: os/exec is forbidden until an exact validated adapter boundary is introduced.
files:
  - "**/*.go"
rule:
  any:
    - all:
        - kind: interpreted_string_literal
        - regex: ^"os/exec"$
        - inside:
            kind: import_spec
    - all:
        - kind: raw_string_literal
        - regex: ^`os/exec`$
        - inside:
            kind: import_spec
