id: os-exec-import-boundary
language: Go
severity: warning
message: os/exec is restricted to internal/gcp, internal/remote, and internal/hostagent.
files:
  - "**/*.go"
ignores:
  - internal/gcp/**/*.go
  - internal/remote/**/*.go
  - internal/hostagent/**/*.go
rule:
  any:
    - all:
        - kind: interpreted_string_literal
        - regex: ^"os/exec"$
        - inside:
            kind: import_spec
    - all:
        - kind: raw_string_literal
        - regex: ^`os/exec`$
        - inside:
            kind: import_spec
